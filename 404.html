<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>
    // Aplicar tema antes del primer pintado (evita parpadeo)
    (function(){
      var t = localStorage.getItem('cc-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — MaterialScan</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#1a1f22 0%,#263238 100%)">

  <nav class="navbar" id="main-navbar" style="background:transparent;border-bottom:1px solid rgba(255,255,255,0.08)">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <svg width="26" height="26" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
          <defs>
            <clipPath id="lens-clip">
              <circle cx="45" cy="45" r="31" />
            </clipPath>
          </defs>
          <circle cx="45" cy="45" r="33.5" stroke="currentColor" stroke-width="5" />
          <line x1="68.5" y1="68.5" x2="90" y2="90" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
          <g clip-path="url(#lens-clip)">
            <path d="M10 20 H80 M10 32 H80 M10 44 H80 M10 56 H80 M10 68 H80 M20 10 V80 M32 10 V80 M44 10 V80 M56 10 V80 M68 10 V80" stroke="currentColor" stroke-width="1" opacity="0.35" />
            <polygon points="21,38 38,28 55,38 38,48" fill="var(--surface-container-lowest)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
            <polygon points="21,38 38,48 38,62 21,52" fill="var(--surface-container-lowest)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
            <polygon points="38,48 55,38 55,52 38,62" fill="var(--surface-container-lowest)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
            <polygon points="27,36 33,32 37,34 31,38" fill="none" stroke="currentColor" stroke-width="1.5" />
            <polygon points="38,39 44,35 48,37 42,41" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M47,44 C47,49 50,50 53,48" stroke="currentColor" stroke-width="1.5" fill="none" />
            <path d="M51,49 L58,43 C60,41 63,41 65,43 L71,49 C73,51 73,54 71,56 L64,62 C62,64 59,64 57,62 L51,56 C49,54 49,51 51,49 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <circle cx="55" cy="51" r="1" fill="var(--background)" />
            <text x="60" y="56" fill="var(--background)" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle" transform="rotate(8, 60, 56)">$</text>
          </g>
        </svg>
        Material<span>Scan</span>
      </a>
    </div>
  </nav>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-xl)">
    <div style="text-align:center;max-width:520px">
      <div class="error-404-code" id="error-404-code">404</div>
      <h1 style="color:#eceff1;font-size:1.75rem;font-weight:700;margin-bottom:var(--space-sm)">Página no encontrada</h1>
      <p style="color:#90a4ae;font-size:1rem;line-height:1.7;margin-bottom:var(--space-xl)">
        La URL que buscas no existe o fue movida.<br />
        Puedes volver al inicio o buscar el producto que necesitas.
      </p>
      <div style="display:flex;gap:var(--space-sm);justify-content:center;flex-wrap:wrap">
        <a href="index.html" class="btn btn-primary btn-lg">
          <span class="material-icons">home</span>
          Volver al inicio
        </a>
        <a href="pages/search.html" class="btn btn-secondary btn-lg">
          <span class="material-icons">search</span>
          Buscar productos
        </a>
      </div>
    </div>
  </main>

  <style>
    .error-404-code{
      font-size:clamp(6rem,18vw,9rem);font-weight:800;
      font-family:var(--font-mono,monospace);
      background:linear-gradient(135deg,var(--primary-container),#ff8f00);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;line-height:1;margin-bottom:var(--space-md);
    }
  </style>
</body>
</html>
